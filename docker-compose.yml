version: '3.8'

services: # Spring Boot Application
  music-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-web-application
    stop_grace_period: 45s
    dns:
        - 8.8.8.8
        - 8.8.4.4
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment: # Cloud Database Configuration (PostgreSQL in cloud)
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
        
        # Upstash Redis
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_USERNAME=${REDIS_USERNAME}
      - SPRING_DATA_REDIS_SSL_ENABLED=true

      # JWT Secret
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}

      # AWS S3 Configuration
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      - AWS_REGION=${AWS_REGION:-us-east-1}

      # Email Configuration
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}

      # JVM Options
      - JAVA_OPTS=-Xms512m -Xmx1024m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0

      # Cache directory
      - APP_CACHE_DIR=/app/song-cache
    networks:
      - music-network
    volumes: # Persist song cache
      - song-cache:/app/song-cache
      # Persist logs
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Networks
networks:
  music-network:
    driver: bridge

# Volumes
volumes:
  redis-data:
    driver: local
  song-cache:
    driver: local