# ============================================
# APPLICATION CONFIGURATION
# ============================================
spring.application.name=music-web-application

# ============================================
# JWT SECURITY
# ============================================
jwt.security.secret-key=${JWT_SECRET_KEY}

# ============================================
# APPLICATION BUSINESS LOGIC
# ============================================
app.music.room.length=6
app.music.pass.code.length=5
app.cache-dir=${user.dir}/song-cache

# ============================================
# SESSION TTL CONFIGURATION
# ============================================
session.ttl.hours=8

# ============================================
# DATABASE CONFIGURATION - COCKROACHDB CLOUD
# ============================================
# IMPORTANT: Set DB_URL environment variable with these parameters:
# jdbc:postgresql://<cluster>.cockroachlabs.cloud:26257/<db>?sslmode=require&options=--cluster%3D<cluster-name>&application_name=music-web-app
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.open-in-view=false

# HikariCP Pool Configuration (Optimized for Oracle VM -> CockroachDB Cloud)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=35000
spring.datasource.hikari.validation-timeout=8000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=25000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=45000
spring.datasource.hikari.init-fail-timeout=10000

# Logging (can be reduced after debugging)
logging.level.com.zaxxer.hikari.HikariConfig=INFO
logging.level.com.zaxxer.hikari=info
logging.level.org.postgresql=INFO

# ============================================
# AWS S3 CONFIGURATION
# ============================================
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.region.static=${AWS_REGION}
aws.bucket.name=${AWS_BUCKET_NAME}
aws.s3.api-call-timeout=900
aws.s3.api-attempt-timeout=450

# ============================================
# FILE UPLOAD CONFIGURATION
# ============================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ============================================
# THYMELEAF CONFIGURATION
# ============================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ============================================
# STATIC RESOURCES
# ============================================
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.cachecontrol.max-age=3600
spring.web.resources.cache.cachecontrol.cache-public=true

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.root=INFO
logging.level.com.music.musicwebapplication=INFO
logging.level.com.music.musicwebapplication.service.UserSessionService=INFO

# ============================================
# FILE LOGGING CONFIGURATION (Oracle VM)
# ============================================
# Writes logs to /app/logs inside container
# Mounted to ./logs on the VM via docker-compose volume
#logging.file.path=/app/logs
#logging.file.name=/app/logs/music-app.log
#logging.logback.rollingpolicy.max-file-size=50MB
#logging.logback.rollingpolicy.max-history=30
#logging.logback.rollingpolicy.total-cap-size=500MB
#logging.logback.rollingpolicy.file-name-pattern=/app/logs/music-app-%d{yyyy-MM-dd}.log.gz

# ============================================
# EMAIL CONFIGURATION
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=12000

# ============================================
# SPRING SCHEDULING CONFIGURATION
# ============================================
spring.task.scheduling.enabled=true
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=scheduled-task-
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=30s

# ============================================
# REDIS CONFIGURATION - ORACLE VM
# ============================================
spring.cache.type=redis
spring.data.redis.database=0
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# SSL Configuration (disabled for local VM Redis)
spring.data.redis.ssl.enabled=false

# Connection Pool Settings (Lettuce)
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=2000ms

# Timeout Settings
spring.data.redis.connect-timeout=10000
spring.data.redis.timeout=10000

# Cache Configuration
spring.cache.cache-names=music,songs,rooms,sessions
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=music-app:
spring.cache.redis.use-key-prefix=true
spring.cache.redis.time-to-live=3600000

# ============================================
# WEBSOCKET CONFIGURATION
# ============================================
spring.websocket.message-size-limit=64KB
spring.websocket.send-buffer-size-limit=512KB
spring.websocket.send-time-limit=20000

# ============================================
# SERVER CONFIGURATION
# ============================================
server.servlet.session.timeout=30m
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=45s

# ============================================
# JACKSON JSON CONFIGURATION
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ============================================
# ASYNC TASK EXECUTION
# ============================================
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=async-task-

# ============================================
# ACTUATOR (for health checks)
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ============================================
# SQL INITIALIZATION
# ============================================
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# ============================================
# BASE URL
# ============================================
app.music.base.url=${BASE_URL}

