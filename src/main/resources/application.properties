# ============================================
# APPLICATION CONFIGURATION
# ============================================
spring.application.name=music-web-application
spring.profiles.active=machine1

# ============================================
# JWT SECURITY
# ============================================
jwt.security.secret-key=${JWT_SECRET_KEY}

# ============================================
# APPLICATION BUSINESS LOGIC
# ============================================
app.music.room.length=6
app.music.pass.code.length=5
# In Docker, this will be /app/song-cache (mapped to volume)
app.cache-dir=${user.dir}/song-cache

# ============================================
# SESSION TTL CONFIGURATION
# ============================================
session.ttl.hours=24

# ============================================
# DATABASE CONFIGURATION
# ============================================
# Docker will set DB_URL to: jdbc:postgresql://postgres:5432/music
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SQL query audit
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.batch.jdbc.initialize-schema=always

# ============================================
# AWS S3 CONFIGURATION
# ============================================
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.region.static=ap-south-1
aws.bucket.name=tony-music-bucket
aws.s3.api-call-timeout=600
aws.s3.api-attempt-timeout=300

# ============================================
# FILE UPLOAD CONFIGURATION
# ============================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ============================================
# THYMELEAF CONFIGURATION
# ============================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ============================================
# STATIC RESOURCES
# ============================================
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.cachecontrol.max-age=3600
spring.web.resources.cache.cachecontrol.cache-public=true

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.root=INFO
logging.level.com.music.musicwebapplication=INFO
logging.level.com.music.musicwebapplication.service.UserSessionService=INFO

# ============================================
# EMAIL CONFIGURATION
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================================
# SPRING SCHEDULING CONFIGURATION
# ============================================
spring.task.scheduling.enabled=true
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=scheduled-task-
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=30s

# ============================================
# REDIS CONFIGURATION
# ============================================
spring.cache.type=redis
# Docker will set REDIS_HOST to: redis (service name)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms
spring.data.redis.lettuce.shutdown-timeout=100ms

# Cache configuration
spring.cache.cache-names=music,songs,rooms,sessions
spring.cache.redis.time-to-live=1h
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=music-app:
spring.cache.redis.use-key-prefix=true

# ============================================
# WEBSOCKET CONFIGURATION
# ============================================
spring.websocket.message-size-limit=64KB
spring.websocket.send-buffer-size-limit=512KB
spring.websocket.send-time-limit=20000

# ============================================
# SERVER CONFIGURATION
# ============================================
server.servlet.session.timeout=30m

# ============================================
# JACKSON JSON CONFIGURATION
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ============================================
# ASYNC TASK EXECUTION
# ============================================
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-task-

# ============================================
# ACTUATOR (for health checks)
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized