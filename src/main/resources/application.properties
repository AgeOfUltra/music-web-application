#machine configuration
spring.profiles.active=machine3
# application.properties #all common properties
spring.application.name=music-web-application
#jwt
jwt.security.secret-key=***

#length control
app.music.room.length=6
app.music.pass.code.length=5


#SQL query audit
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.batch.jdbc.initialize-schema=always
#S3
cloud.aws.credentials.access-key =**
cloud.aws.credentials.secret-key =**
cloud.aws.region.static =ap-south-1
# Maximum file size for individual files (default is 1MB)
spring.servlet.multipart.max-file-size=100MB

# Maximum request size for multipart/form-data (default is 10MB)
spring.servlet.multipart.max-request-size=100MB
aws.bucket.name=tony-music-bucket

#thymelaf properties
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/


spring.web.resources.static-locations=classpath:/static/
##loging
#logging.level.com.music.musicwebapplication=ERROR
#logging.level.org.springframework.messaging=DEBUG
#logging.level.org.springframework.web.socket=DEBUG

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=**
spring.mail.password=**
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#redis cache
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.cache-names=music
spring.cache.redis.time-to-live=1h

# Location where cached songs will be stored
app.cache-dir=${user.dir}/song-cache
