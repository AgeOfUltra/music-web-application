<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style_upload.css}">
    <title>Connecting Notes ∞ - Upload Song</title>

</head>
<body>
<div th:replace="~{fragments/loader}"></div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-3 px-md-4">
        <div class="d-flex align-items-center justify-content-between w-100">
            <a class="navbar-brand" href="/">
                <img th:src="@{/images/app_logo_wn.png}" alt="Logo">
                <span>CONNECTING NOTES</span>
            </a>
        </div>
    </div>
</nav>

<!-- Breadcrumb -->
<nav aria-label="breadcrumb" class="bg-light" style="background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%) !important;">
    <div class="container-fluid px-3 px-md-4 py-3">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a th:href="@{/app/music/dashboard}"><i class="bi bi-house"></i> Home</a></li>
            <li class="breadcrumb-item active">Upload Song</li>
        </ol>
    </div>
</nav>

<!-- Main Content -->
<div class="main-container">
    <div class="upload-container">
        <div class="upload-card">
            <!-- Upload Header -->
            <div class="upload-header">
                <i class="bi bi-music-note-beamed"></i>
                <h2>Upload New Song</h2>
                <p>Share your music with the community</p>
            </div>

            <!-- Success Toast -->
            <div th:if="${songUploadedSuccess}" id="successToast" class="toast-notification success-toast">
                <div>
                    <i class="bi bi-check-circle"></i>
                    <span>Song uploaded successfully!</span>
                </div>
            </div>

            <!-- Error Toast -->
            <div th:if="${songUploadFailed}" id="errorToast" class="toast-notification error-toast">
                <div>
                    <i class="bi bi-exclamation-circle"></i>
                    <span th:text="${songUploadFailed}"></span>
                </div>
            </div>

            <!-- Field Errors -->
            <div th:if="${#fields.hasErrors('songContainer.*')}" class="alert alert-danger" role="alert">
                <h5 class="alert-heading"><i class="bi bi-exclamation-triangle"></i> Validation Errors</h5>
                <span th:each="error : ${#fields.errors('songContainer.*')}" th:text="${error}" class="d-block"></span>
            </div>

            <!-- Form -->
            <form id="uploadForm" method="POST" th:action="@{/app/music/admin/upload}" enctype="multipart/form-data" th:object="${songContainer}">

                <!-- File Upload Section -->
                <div class="mb-4">
                    <label for="fileInput" class="form-label">Song File</label>
                    <div class="file-upload-area">
                        <input type="file" id="fileInput" th:field="*{file}" class="d-none" accept="audio/*">
                        <div class="upload-placeholder" onclick="document.getElementById('fileInput').click()">
                            <i class="bi bi-cloud-arrow-up"></i>
                            <p>Click to upload or drag and drop</p>
                            <small>Supported formats: MP3</small>
                        </div>
                        <div id="fileNameDisplay" class="file-name"></div>
                    </div>
                </div>

                <!-- Song Details Section -->
                <div class="form-section">
                    <div class="form-section-title">
                        <i class="bi bi-info-circle"></i>
                        Song Details
                    </div>

                    <!-- Row 1 -->
                    <div class="row g-3 mb-3">
                        <div class="col-12 col-md-6">
                            <label for="songName" class="form-label">Song Name <span class="text-danger"></span></label>
                            <input type="text" class="form-control" id="songName" th:field="*{songName}" th:value="*{#strings.trim(songName)}" placeholder="Enter song name">
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="fileName" class="form-label">File Name <span class="text-danger"></span></label>
                            <input type="text" class="form-control" id="fileName" th:field="*{fileName}" th:value="*{#strings.trim(fileName)}" placeholder="e.g., song_title.mp3">
                        </div>
                    </div>

                    <!-- Row 2 -->
                    <div class="row g-3 mb-3">
                        <div class="col-12 col-md-6">
                            <label for="movie" class="form-label">Movie <span class="text-danger"></span></label>
                            <input type="text" class="form-control" id="movie" th:field="*{movie}" th:value="*{#strings.trim(movie)}" placeholder="Enter movie name">
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="singer" class="form-label">Singer <span class="text-danger"></span></label>
                            <input type="text" class="form-control" id="singer" th:field="*{singer}" th:value="*{#strings.trim(singer)}" placeholder="Enter singer name">
                        </div>
                    </div>

                    <!-- Row 3 -->
                    <div class="row g-3 mb-3">
                        <div class="col-12 col-md-6">
                            <label for="language" class="form-label">Language <span class="text-danger"></span></label>
                            <select class="form-select" id="language" th:field="*{language}">
                                <option value="">Select Language</option>
                                <option value="Hindi">Hindi</option>
                                <option value="English">English</option>
                                <option value="Tamil">Tamil</option>
                                <option value="Telugu">Telugu</option>
                                <option value="Malayalam">Malayalam</option>
                                <option value="Japanese">Japanese</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="songType" class="form-label">Song Type <span class="text-danger"></span></label>
                            <select class="form-select" id="songType" th:field="*{songType}">
                                <option value="">Select Type</option>
                                <option value="Item">Item</option>
                                <option value="Love">Love</option>
                                <option value="Romantic">Romantic</option>
                                <option value="Melody">Melody</option>
                                <option value="Sad">Sad/Heart Break</option>
                                <option value="Mass">Mass</option>
                                <option value="Friendship">Friendship</option>
                                <option value="Folk">Folk</option>
                                <option value="Enjoy/Party">Enjoy/Party</option>
                                <option value="Folk DJ">Folk DJ</option>
                                <option value="Rap">Rap</option>
                                <option value="Motivation">Motivation</option>
                                <option value="other">other</option>
                            </select>
                        </div>
                    </div>

                    <!-- Row 4 -->
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label for="hero" class="form-label">Hero</label>
                            <input type="text" class="form-control" id="hero" th:field="*{hero}" placeholder="Enter hero name (optional)">
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="heroine" class="form-label">Heroine</label>
                            <input type="text" class="form-control" id="heroine" th:field="*{heroine}" placeholder="Enter heroine name (optional)">
                        </div>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                    <button type="submit" class="btn btn-upload">
                        <i class="bi bi-cloud-arrow-up"></i> Upload Song
                    </button>
                    <a th:href="@{/app/music/dashboard}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Back
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Initialize loader for Upload form
    LoaderPlugin.initFormSubmit('uploadForm');

    // Hide loader if there are field errors
    LoaderPlugin.hideOnError('fieldErrors');

    // Hide loader if upload was successful (prevents loader from showing during success toast)
    window.addEventListener('load', function() {
        const successToast = document.getElementById('successToast');
        if (successToast) {
            LoaderPlugin.hide();
        }
    });
</script>
<script th:src="@{/js/script_upload.js}"></script>
</body>
</html>
