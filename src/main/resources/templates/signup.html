<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="N-arSm7SscrWMdntAq5snbOaQTgO5r9rrFcs_PgdsYs" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="icon" type="image/png" href="/public/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
    <link rel="shortcut icon" href="/public/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/public/apple-touch-icon.png" />
    <link rel="manifest" href="/public/site.webmanifest" />

    <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style_signup.css}">

    <title>Connecting Note ∞ - SignUp</title>
</head>
<body>
<div class="container-signup">
    <div class="logo-container">
        <img th:src="@{/images/app_logo_3_1.png}" alt="Connecting Notes Logo">
    </div>

    <div th:replace="~{fragments/loader}"></div>
    <div id="signupForm">
        <h1>Create Account</h1>
        <p class="subtitle">Join the music chat community</p>

        <div id="fieldErrors" style="display: none;">
            <span th:each="error : ${#fields.errors('newUser.*')}" th:text="${error}" class="error-item"></span>
        </div>

        <div id="generalError" style="display: none;" th:text="${signUpError}"></div>


        <form th:action="@{/app/music/public/register}" method="post" th:object="${newUser}" id="signupFormElement">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text"
                       id="username"
                       th:field="*{username}"
                       placeholder="Enter username"
                       required>
                <span class="error-message" id="usernameError" style="color: red; font-size: 12px; display: none;"></span>
                <p style="font-size: 11px; color: #666; margin-top: 5px;">
                    Min 5 characters. Allowed special chars: @ $ & #
                </p>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" placeholder="Enter your email" required>
                <span class="error-message" id="emailError" style="color: red; font-size: 12px; display: none;"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="password" th:field="*{password}" placeholder="" required>
                    <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                        <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                </div>
                <span class="error-message" id="passwordError" style="color: red; font-size: 12px; display: none;"></span>
                <div class="password-requirements" id="passwordRequirements">
                    <p style="font-size: 11px; color: #666; margin-top: 5px;">Password must contain:</p>
                    <ul style="font-size: 11px; color: #666; margin: 5px 0; padding-left: 20px;">
                        <li id="req-length">8-20 characters</li>
                        <li id="req-uppercase">One uppercase letter</li>
                        <li id="req-lowercase">One lowercase letter</li>
                        <li id="req-number">One number</li>
                        <li id="req-special">One special character (!@#$%^&*...)</li>
                    </ul>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Sign Up</button>
        </form>
        <div class="toggle-form">
            Already have an account? <a th:href="@{/app/music/public/login}">Login</a>
        </div>
    </div>
</div>

<div class="toast-container-custom" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script_signup.js}"></script>
<script>
    // Initialize loader for Sign Up form
    LoaderPlugin.initFormSubmit('signupFormElement');

    // Hide loader if there are field errors
    LoaderPlugin.hideOnError('fieldErrors');

    // Hide loader if there's a general signup error
    LoaderPlugin.hideOnError('generalError');

    const usernameInput = document.getElementById('username');
    const errorMessage = usernameInput.nextElementSibling;

    // Prevent spaces from being typed
    usernameInput.addEventListener('keydown', function(e) {
        if (e.key === ' ' || e.keyCode === 32) {
            e.preventDefault();
        }
    });

    // Validate on input (removes spaces if pasted)
    usernameInput.addEventListener('input', function(e) {
        if (this.value.includes(' ')) {
            this.value = this.value.replace(/\s/g, '');
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 2000);
        }
    });

    // Validate on blur
    usernameInput.addEventListener('blur', function() {
        if (this.value.includes(' ')) {
            this.value = this.value.trim().replace(/\s/g, '');
        }
    });

    </script>
</body>
</html>
