<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&display=swap" rel="stylesheet">

    <title>Connecting Notes - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Alan Sans", sans-serif;
            font-style: normal;
            background: linear-gradient(135deg, #0a0a0a 0%, #2d2d2d 50%, #1a1a1a 100%);
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                    radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.03) 0%, transparent 50%),
                    radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        .header {
            background: linear-gradient(145deg, #ffffff 0%, #f5f5f5 100%);
            padding: 15px 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            height: 95px;
            width: auto;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        .app-name {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #000000 0%, #434343 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logout-btn {
            padding: 10px 24px;
            background: linear-gradient(135deg, #000000 0%, #2d2d2d 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .logout-btn:hover {
            background: linear-gradient(135deg, #2d2d2d 0%, #434343 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        .welcome-card {
            background: linear-gradient(145deg, #ffffff 0%, #f5f5f5 100%);
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow:
                    0 10px 40px rgba(0, 0, 0, 0.4),
                    inset 0 1px 0 rgba(255, 255, 255, 0.6);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .welcome-card h1 {
            background: linear-gradient(135deg, #000000 0%, #434343 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .welcome-card p {
            color: #555;
            font-size: 16px;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .option-card {
            background: linear-gradient(145deg, #ffffff 0%, #f8f8f8 100%);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow:
                    0 10px 40px rgba(0, 0, 0, 0.4),
                    inset 0 1px 0 rgba(255, 255, 255, 0.6);
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
        }

        .option-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.03) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .option-card:hover::before {
            opacity: 1;
        }

        .option-card:hover {
            transform: translateY(-8px);
            box-shadow:
                    0 20px 60px rgba(0, 0, 0, 0.5),
                    inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .option-card h2 {
            background: linear-gradient(135deg, #000000 0%, #434343 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            font-size: 24px;
            position: relative;
        }

        .option-card p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .option-btn {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .option-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .option-btn:hover::before {
            left: 100%;
        }

        .btn-create {
            background: linear-gradient(135deg, #000000 0%, #2d2d2d 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-join {
            background: linear-gradient(135deg, #2d2d2d 0%, #505050 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .option-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(145deg, #ffffff 0%, #f5f5f5 100%);
            padding: 40px;
            border-radius: 20px;
            width: 500px;
            max-width: 90%;
            box-shadow:
                    0 20px 60px rgba(0, 0, 0, 0.6),
                    inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .modal-header h2 {
            background: linear-gradient(135deg, #000000 0%, #434343 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 24px;
        }

        .close-btn {
            background: #f0f0f0;
            border: none;
            font-size: 28px;
            color: #666;
            cursor: pointer;
            padding: 0;
            width: 35px;
            height: 35px;
            line-height: 1;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: #e0e0e0;
            color: #000;
            transform: rotate(90deg);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2d2d2d;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            background: #fafafa;
        }

        input:focus {
            outline: none;
            border-color: #404040;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-error {
            background: #ffe6e6;
            color: #c33;
            border: 1px solid #ffcccc;
        }

        .alert-success {
            background: #e6f4ea;
            color: #1e7e34;
            border: 1px solid #c3e6cb;
        }

        .validation-error {
            color: #c33;
            font-size: 12px;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .options-container {
                grid-template-columns: 1fr;
            }

            .header-left {
                gap: 10px;
            }

            .logo {
                height: 40px;
            }

            .app-name {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
<div class="header">
    <div class="header-left">
        <img src="/app_logo.png" alt="Connecting Notes Logo" class="logo">
        <div class="app-name">CONNECTING NOTES</div>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="container">
    <div class="welcome-card">
<!--        <h1>Welcome, <span id="usernameDisplay"></span>!</h1>-->

        <h1 th:text ="'Welcome! ' + ${username}"></h1>
        <p>Choose an option below to get started with music streaming and chat</p>
    </div>

    <div class="options-container">
        <div class="option-card" onclick="openCreateModal()">
            <h2>Create Room</h2>
            <p>Start a new music streaming room and invite friends to join</p>
            <button class="option-btn btn-create">Create New Room</button>
        </div>

        <div class="option-card" onclick="openJoinModal()">
            <h2>Join Room</h2>
            <p>Enter an existing room and enjoy music with others</p>
            <button class="option-btn btn-join">Join Existing Room</button>
        </div>
    </div>
</div>

<div id="createModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Create New Room</h2>
            <button class="close-btn" onclick="closeCreateModal()">&times;</button>
        </div>

        <div id="createAlert" class="alert"></div>

        <form id="createRoomForm" onsubmit="createRoom(event)">
            <div class="form-group">
                <label for="createRoomName">Room Name</label>
                <input type="text" id="createRoomName" required placeholder="Enter room name">
            </div>

            <div class="form-group">
                <label for="maxParticipants">Maximum Participants (2-10)</label>
                <input type="number" id="maxParticipants" min="2" max="10" value="5" required>
                <div id="participantError" class="validation-error" style="display: none;">
                    Please enter a value between 2 and 10
                </div>
            </div>

            <button type="submit" class="submit-btn btn-create">Create Room</button>
        </form>
    </div>
</div>

<div id="joinModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Join Existing Room</h2>
            <button class="close-btn" onclick="closeJoinModal()">&times;</button>
        </div>

        <div id="joinAlert" class="alert"></div>

        <form id="joinRoomForm" onsubmit="joinRoom(event)">
            <div class="form-group">
                <label for="joinRoomName">Room Name</label>
                <input type="text" id="joinRoomName" required placeholder="Enter room name to join">
            </div>

            <button type="submit" class="submit-btn btn-join">Join Room</button>
        </form>
    </div>
</div>

<script>
    window.onload = function() {
        checkAuthentication();
        displayUsername();
    };

    function checkAuthentication() {
        const token = getCookie('jwtToken') || localStorage.getItem('jwtToken');
        if (!token) {
            window.location.href = '/app/music/public/login';
        }
    }

    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
    }

    function displayUsername() {
        const username = localStorage.getItem('username');
        if (username) {
            document.getElementById('usernameDisplay').textContent = username;
        }
    }

    function logout() {
        localStorage.removeItem('jwtToken');
        localStorage.removeItem('username');
        localStorage.removeItem('currentRoom');
        document.cookie = 'jwtToken=; path=/; max-age=0; SameSite=Lax';
        window.location.href = '/app/music/public/login';
    }

    function openCreateModal() {
        document.getElementById('createModal').classList.add('active');
    }

    function closeCreateModal() {
        document.getElementById('createModal').classList.remove('active');
        document.getElementById('createRoomForm').reset();
        hideAlert('createAlert');
    }

    function openJoinModal() {
        document.getElementById('joinModal').classList.add('active');
    }

    function closeJoinModal() {
        document.getElementById('joinModal').classList.remove('active');
        document.getElementById('joinRoomForm').reset();
        hideAlert('joinAlert');
    }

    function showAlert(elementId, message, type = 'error') {
        const alert = document.getElementById(elementId);
        alert.textContent = message;
        alert.className = `alert alert-${type}`;
        alert.style.display = 'block';
    }

    function hideAlert(elementId) {
        document.getElementById(elementId).style.display = 'none';
    }

    document.getElementById('maxParticipants').addEventListener('input', function(e) {
        const value = parseInt(e.target.value);
        const errorDiv = document.getElementById('participantError');

        if (value < 2 || value > 10) {
            errorDiv.style.display = 'block';
            e.target.setCustomValidity('Value must be between 2 and 10');
        } else {
            errorDiv.style.display = 'none';
            e.target.setCustomValidity('');
        }
    });

    async function createRoom(event) {
        event.preventDefault();

        const roomName = document.getElementById('createRoomName').value;
        const maxCount = parseInt(document.getElementById('maxParticipants').value);
        const username = localStorage.getItem('username');
        const token = getCookie('jwtToken') || localStorage.getItem('jwtToken');

        if (maxCount < 2 || maxCount > 10) {
            showAlert('createAlert', 'Max participants must be between 2 and 10', 'error');
            return;
        }

        try {
            const response = await fetch(`/app/music/room/create?roomName=${encodeURIComponent(roomName)}&maxCount=${maxCount}&username=${encodeURIComponent(username)}`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('currentRoom', roomName);
                window.location.href = `/app/music/chat?roomName=${encodeURIComponent(roomName)}`;
            } else {
                const error = await response.json();
                showAlert('createAlert', error.message || 'Failed to create room', 'error');
            }
        } catch (error) {
            showAlert('createAlert', 'Network error. Please try again.', 'error');
            console.error('Create room error:', error);
        }
    }

    async function joinRoom(event) {
        event.preventDefault();

        const roomName = document.getElementById('joinRoomName').value;
        const username = localStorage.getItem('username');
        const token = getCookie('jwtToken') || localStorage.getItem('jwtToken');

        try {
            const response = await fetch(`/app/music/room/join?roomName=${encodeURIComponent(roomName)}&username=${encodeURIComponent(username)}`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('currentRoom', roomName);
                window.location.href = `/app/music/chat?roomName=${encodeURIComponent(roomName)}`;
            } else {
                const error = await response.json();
                showAlert('joinAlert', error.message || 'Failed to join room', 'error');
            }
        } catch (error) {
            showAlert('joinAlert', 'Network error. Please try again.', 'error');
            console.error('Join room error:', error);
        }
    }

    window.onclick = function(event) {
        const createModal = document.getElementById('createModal');
        const joinModal = document.getElementById('joinModal');

        if (event.target === createModal) {
            closeCreateModal();
        }
        if (event.target === joinModal) {
            closeJoinModal();
        }
    }
</script>
</body>
</html>
