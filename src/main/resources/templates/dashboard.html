<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style_dasboard.css}">

    <title>Connecting Notes - Dashboard</title>
</head>
<body>
<div class="header">
    <div class="header-left">
        <img src="/app_logo.png" alt="Connecting Notes Logo" class="logo">
        <div class="app-name">CONNECTING NOTES</div>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="container">
    <div class="welcome-card">
        <h1 th:text="'Welcome! ' + ${username}"></h1>
        <p>Choose an option below to get started with music streaming and chat</p>
    </div>

    <div class="options-container">
        <div class="option-card" onclick="openCreateModal()">
            <h2>Create Room</h2>
            <p>Start a new music streaming room and invite friends to join</p>
            <button class="option-btn btn-create">Create New Room</button>
        </div>

        <div class="option-card" onclick="openJoinModal()">
            <h2>Join Room</h2>
            <p>Enter an existing room and enjoy music with others</p>
            <button class="option-btn btn-join">Join Existing Room</button>
        </div>
    </div>
</div>

<div id="createModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Create New Room</h2>
            <button class="close-btn" onclick="closeCreateModal()">&times;</button>
        </div>

        <div id="createAlert" class="alert"></div>

        <form th:action="@{/app/music/room/create}" th:method="POST">
            <div class="form-group">
                <label for="roomName">Room Name</label>
                <input type="text" id="roomName" name="roomName" required placeholder="Enter room name">
            </div>

            <div class="form-group">
                <label for="maxCount">Maximum Participants (2-10)</label>
                <input type="number" id="maxCount" name="maxCount" min="2" max="10" value="5" required>
                <div id="participantError" class="validation-error" style="display: none;">
                    Please enter a value between 2 and 10
                </div>
            </div>

            <div class="form-group">
                <label for="username">User name</label>
                <input type="text" id="username" name="username" required th:value="${username}" readonly>
            </div>

            <button type="submit" class="submit-btn btn-create">Create Room</button>
        </form>
    </div>
</div>

<div id="joinModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Join Existing Room</h2>
            <button class="close-btn" onclick="closeJoinModal()">&times;</button>
        </div>

        <div id="joinAlert" class="alert"></div>

        <form th:action="@{/app/music/room/join}" id="joinRoomForm" th:method="POST">
            <div class="form-group">
                <label for="joinRoomName">Room Name</label>
                <input type="text" id="joinRoomName" name="roomName" required placeholder="Enter room name to join">
            </div>

            <div class="form-group">
                <label for="joinUsername">User name</label>
                <input type="text" id="joinUsername" name="username" required th:value="${username}" readonly>
            </div>

            <button type="submit" class="submit-btn btn-join">Join Room</button>
        </form>
    </div>
</div>

<script th:src="@{/js/script_dasboard.js}"></script>
</body>
</html>
