<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style_login.css}">

    <title>Connecting Notes ∞ - Login</title>
</head>
<body>
<!--loading animation div-->
<div th:replace="~{fragments/loader}"></div>

<div class="container-login">
    <div class="logo-container">
        <img th:src="@{/images/app_logo_3_1.png}" alt="Connecting Notes Logo">
    </div>

    <div id="loginForm">
        <h1>Welcome!</h1>
        <p class="subtitle">Login to join music chat rooms</p>

        <!-- Hidden container for Thymeleaf error data -->
        <div id="errorMessage" style="display: none;" th:text="${loginError}"></div>

        <form th:action="@{/app/music/public/authenticate}" method="post" th:object="${loginUser}" id="loginFormElement">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" th:field="*{username}" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <div class="toggle-form">
            Don't have an account? <a th:href="@{/app/music/public/signUp}">SignUp</a>
        </div>
    </div>

</div>

<div class="toast-container-custom" id="toastContainer"></div>

<div id="registrationSuccess" style="display: none;" th:text="${showRegistrationSuccess}"></div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Show loader on login form submit
    LoaderPlugin.initFormSubmit('loginFormElement');

    // Hide loader if there's an error
    LoaderPlugin.hideOnError('errorMessage');
</script>
<script th:src="@{/js/script_login.js}"></script>

</body>
</html>
