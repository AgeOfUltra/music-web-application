<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="N-arSm7SscrWMdntAq5snbOaQTgO5r9rrFcs_PgdsYs" />
    <title>Connecting Note ∞ - Chat Room</title>

    <link rel="icon" type="image/png" href="/public/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
    <link rel="shortcut icon" href="/public/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/public/apple-touch-icon.png" />
    <link rel="manifest" href="/public/site.webmanifest" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&display=swap" rel="stylesheet">
    <!-- WebSocket Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.2/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/style_chat.css}">
</head>
<body>

<header class="header glass">
    <div class="header-wrapper">
        <!-- Back Button (Desktop Only) -->
        <div class="header-left-section">
            <button class="header-back-btn" type="button" onclick="handleBack()">
                <i class="bi bi-arrow-left"></i> Back
            </button>
        </div>

        <!-- Logo and Title (Always Centered) -->
        <div class="header-center-section">
            <img th:src="@{/images/app_logo_wn.png}" alt="Logo" class="header-logo">
            <div class="header-title">CONNECTING NOTE</div>
        </div>

        <!-- Logout (Desktop) / Menu Icon (Mobile) -->
        <div class="header-right-section">
            <button class="header-logout-btn" type="button" onclick="logout()">
                Logout <i class="bi bi-box-arrow-right"></i>
            </button>

            <button class="header-menu-icon" type="button" onclick="toggleMobileMenu(event)">
                <i class="bi bi-list"></i>
            </button>
        </div>
    </div>
</header>

<!-- Mobile Dropdown Menu (OUTSIDE header) -->
<div class="mobile-dropdown-menu" id="mobileDropdownMenu">
    <div class="mobile-menu-item" onclick="handleBack(); closeMobileMenu();">
        <i class="bi bi-arrow-left"></i>
        <span>Back</span>
    </div>
    <div class="mobile-menu-item" onclick="logout();">
        <i class="bi bi-box-arrow-right"></i>
        <span>Logout</span>
    </div>
</div>

<!-- Overlay (OUTSIDE header) -->
<div class="mobile-dropdown-overlay" id="mobileDropdownOverlay" onclick="closeMobileMenu()"></div>

<!-- Success Message Container (hidden) -->
<div id="successMessageCreate" style="display: none;" th:text="${roomCreatedSuccessful}"></div>
<div id="successMessageJoin" style="display: none;" th:text="${roomJoinedSuccessful}"></div>

<div class="main-container">
    <div class="left-panel">
        <div class="music-player">
            <div class="player-info">
                <div class="song-title" id="currentSongTitle">No song playing</div>
                <div class="song-details" id="currentSongDetails">Select a song to play</div>
            </div>

            <button class="mobile-open-playlist-btn" id="mobileOpenPlaylistBtn">
                <i class="bi bi-music-note-list"></i>
                View Playlist
            </button>

            <!-- NEW: Combined audio player and controls in one row -->
            <div class="audio-controls-container">
                <button class="playback-btn-inline"  id="prevSongBtn">
                    <i class="bi bi-skip-start-fill"></i>
                </button>

                <div id="audioPlayerWrapper" th:classappend="${isOrganizer} ? 'organizer-audio' : 'readonly-audio'">
                    <audio id="audioPlayer" controls controlsList="nodownload noplaybackrate"></audio>
                </div>

                <button class="playback-btn-inline">
                    <i class="bi bi-skip-end-fill"></i>
                </button>
            </div>
            <!-- Mobile Navigation Buttons (Below Audio Player) -->
            <div class="mobile-nav-buttons">
                <button class="mobile-nav-btn" id="mobilePrevBtn2">
                    <i class="bi bi-skip-start-fill"></i>
                </button>
                <button class="mobile-nav-btn" id="mobileNextBtn2">
                    <i class="bi bi-skip-end-fill"></i>
                </button>
            </div>


            <div class="keyboard-hint" id="keyboardHint" style="display: none;">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="search-btn" onclick="openSearchDrawer()" style="flex: 1;">
                    <i class="bi bi-search"></i> Search Songs
                </button>
                <button class="search-btn" onclick="openFavoritesDrawer()" style="flex: 1; background: linear-gradient(135deg, #598ae4, #051251);">
                    <i class="bi bi-heart-fill"></i> Favorites (<span id="favoritesCount">0</span>)
                </button>
            </div>
        </div>

        <div id="permissionNotice" class="permission-notice" style="display: none;">
            Only the organizer can control playback
        </div>

        <!-- PAGINATION CONTROLS -->
        <div class="pagination-header">
            <h3>Songs</h3>
            <div class="pagination-info">
                Page <span class="current-page">1</span> of <span class="total-pages">1</span>
            </div>
        </div>

        <div class="song-list" id="songList">
            <!-- Songs loaded dynamically via JavaScript -->
        </div>

        <!-- PAGINATION BUTTONS -->
        <div class="pagination-controls">
            <button class="nav-button" id="prevBtn" onclick="previousPage()" title="Previous Page">
                ‹ Previous
            </button>
            <div class="page-info">
                <span class="page-counter"><span id="currentPageNum">1</span>/<span id="totalPagesNum">1</span></span>
            </div>
            <button class="nav-button" id="nextBtn" onclick="nextPage()" title="Next Page">
                Next ›
            </button>
        </div>
    </div>

    <div class="middle-panel">
        <div class="room-header">
            <div class="room-name" id="roomName">
                <span th:text="${roomName}"></span>
                <i class="bi bi-copy" id="copyRoomInfo" title="Copy room details to share with others"></i>
                <span style="font-size: 10px;">(Copy to share Room)</span>
            </div>

            <div class="room-user-info">Logged in as: <span th:text="${username}"></span></div>
            <div class="participant-count" id="participantCount" th:text="'Participants: ' + ${roomCount} + '/' + ${totalCount}"></div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="system-message">Welcome to the chat room!</div>
        </div>
        <div class="typing-indicator" id="typingIndicator" style="display: none;">
            <span class="typing-user"></span>
            <span class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </span>
        </div>
        <div class="chat-input-container">
            <input type="text" class="chat-input" id="messageInput" placeholder="Type a message..."
                   onkeypress="handleEnter(event)">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <div class="right-panel">
        <div class="online-header">
            <div class="online-title">Online Participants</div>
        </div>
        <div class="participants-list" id="participantsList">
            <!-- Participants loaded dynamically via JavaScript -->
        </div>
    </div>
</div>

<!-- Search Drawer -->
<div class="search-drawer" id="searchDrawer">
    <div class="drawer-header">
        <h2>Search Songs</h2>
        <button class="drawer-close" onclick="closeSearchDrawer()">&times;</button>
    </div>
    <div class="drawer-search">
        <label for="searchInput">Search by song/movie name</label>
        <input type="text" id="searchInput" placeholder="Search by song/movie name..." onkeypress="handleSearchEnter(event)">
        <button class="search-btn" onclick="searchSongs()" style="margin-top: 10px; width: 100%;">Search</button>
    </div>
    <div class="drawer-results" id="searchResults"></div>
</div>

<!-- Favorites Drawer -->
<div class="search-drawer" id="favoritesDrawer">
    <div class="drawer-header">
        <h2><i class="bi bi-heart-fill"></i> Favorite Songs</h2>
        <button class="drawer-close" onclick="closeFavoritesDrawer()">&times;</button>
    </div>
    <div class="drawer-search">
        <button class="search-btn" onclick="playFavoritesPlaylist()"
                style="width: 100%; background: linear-gradient(135deg, #10b981, #059669); margin-bottom: 10px;">
            <i class="bi bi-play-circle-fill"></i> Play All Favorites
        </button>
        <button class="search-btn" onclick="clearAllFavorites()"
                style="width: 100%; background: linear-gradient(135deg, #ef4444, #dc2626);">
            <i class="bi bi-trash"></i> Clear All
        </button>
    </div>
    <div class="drawer-results" id="favoritesList" style="padding-top: 10px;">
        <!-- Favorites loaded dynamically via JavaScript -->
    </div>
</div>

<!-- Toast Container -->
<div id="toastContainer" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>
<div id="internetWidgetContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<div class="playlist-drawer-overlay" id="playlistDrawerOverlay"></div>

<!-- Mobile Playlist Drawer -->
<div class="mobile-playlist-drawer" id="mobilePlaylistDrawer">
    <div class="drawer-header">
        <h2>Playlist</h2>
        <button class="drawer-close" id="closePlaylistDrawer">
            <i class="bi bi-x"></i>
        </button>
    </div>

    <div class="mobile-playlist-content">
        <!-- Pagination Header -->
        <div class="pagination-header">
            <h3>Songs</h3>
            <span class="pagination-info" id="mobilePageInfo">Page 1 of 26</span>
        </div>

        <!-- Song List Container -->
        <div class="song-list" id="mobileSongList">
            <!-- Songs will be dynamically loaded here -->
        </div>

        <!-- Pagination Controls -->
        <div class="pagination-controls">
            <button class="nav-button" id="mobilePrevBtn">
                <i class="bi bi-chevron-left"></i> Previous
            </button>
            <div class="page-info">
                <span class="page-counter" id="mobilePageCounter">1/26</span>
            </div>
            <button class="nav-button" id="mobileNextBtn">
                Next <i class="bi bi-chevron-right"></i>
            </button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const PAGE_DATA = {
        username: /*[[${username}]]*/ '',
        roomName: /*[[${roomName}]]*/ '',
        roomCount: /*[[${roomCount}]]*/ 0,
        totalCount: /*[[${totalCount}]]*/ 0,
        jwtToken: /*[[${jwtToken}]]*/ '',
        roomCode: /*[[${roomCode}]]*/ '',
        passCode: /*[[${passCode}]]*/ '',
        expireAt: /*[[${expireAt}]]*/ '',
        isOrganizer: /*[[${isOrganizer}]]*/ false

    };
    /*]]>*/

    document.getElementById("copyRoomInfo").addEventListener("click", () => {
        const roomCode = PAGE_DATA.roomCode;
        const passCode = PAGE_DATA.passCode || ""; // if you added passCode in PAGE_DATA

        const textToCopy = `Room Code: ${roomCode}\nPasscode: ${passCode}`;

        navigator.clipboard.writeText(textToCopy)
            .then(() => {
                alert("Copied:\n" + textToCopy);
            })
            .catch(err => console.error("Copy failed", err));
    });

</script>
<script th:src="@{/js/script_chat.js}"></script>
<script>
    // Toggle mobile menu
    function toggleMobileMenu(event) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }

        const menu = document.getElementById('mobileDropdownMenu');
        const overlay = document.getElementById('mobileDropdownOverlay');

        if (!menu || !overlay) {
            console.error('Menu elements not found');
            return;
        }

        const isOpen = menu.classList.contains('show');

        if (isOpen) {
            closeMobileMenu();
        } else {
            openMobileMenu();
        }
    }

    // Open mobile menu
    function openMobileMenu() {
        const menu = document.getElementById('mobileDropdownMenu');
        const overlay = document.getElementById('mobileDropdownOverlay');

        if (menu && overlay) {
            menu.classList.add('show');
            overlay.classList.add('show');
            document.body.style.overflow = 'hidden'; // Prevent scrolling
        }
    }

    // Close mobile menu
    function closeMobileMenu() {
        const menu = document.getElementById('mobileDropdownMenu');
        const overlay = document.getElementById('mobileDropdownOverlay');

        if (menu && overlay) {
            menu.classList.remove('show');
            overlay.classList.remove('show');
            document.body.style.overflow = ''; // Restore scrolling
        }
    }

    // Close on escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeMobileMenu();
        }
    });

    // Prevent menu from closing when clicking inside it
    document.addEventListener('DOMContentLoaded', function() {
        const menu = document.getElementById('mobileDropdownMenu');
        if (menu) {
            menu.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        }
    });
    // Show keyboard hint only for organizers at page load
    window.addEventListener('load', () => {
        const hint = document.getElementById('keyboardHint');
        if (PAGE_DATA.isOrganizer && hint) {
            hint.style.display = 'block';
        }


        if (typeof window.updatePlaybackButtons === 'function') {
            try { window.updatePlaybackButtons(); } catch (e) { console.warn('updatePlaybackButtons call failed', e); }
        } else {
            // fallback initializer (doesn't replace any functions)
            const prevBtn = document.getElementById('prevSongBtn');
            const nextBtn = document.getElementById('nextSongBtn');
            if (prevBtn && nextBtn && !PAGE_DATA.isOrganizer) {
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                prevBtn.title = 'Only organizer can skip songs';
                nextBtn.title = 'Only organizer can skip songs';
            }
        }
    });

</script>
</body>
</html>
