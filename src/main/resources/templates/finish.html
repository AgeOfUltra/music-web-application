<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You  ∞ - Connecting Notes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Alan Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #764ba2 30%, #f093fb 100%);
            background-size: 400% 400%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* CONFETTI ANIMATION */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #fff;
            animation: confettiFall linear infinite;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* FLOATING EMOJIS */
        .emoji {
            position: absolute;
            font-size: 40px;
            animation: floatEmoji linear infinite;
            opacity: 0.8;
        }

        @keyframes floatEmoji {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* MAIN CONTENT */
        .content-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 60px 80px;
            text-align: center;
            max-width: 700px;
            width: 90%;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.3);
            animation: contentSlideIn 1s ease-out, contentFloat 3s ease-in-out infinite;
            position: relative;
            z-index: 10;
        }

        @keyframes contentSlideIn {
            from {
                transform: translateY(-100px) scale(0.8);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes contentFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* ANIMATED ICON */
        .celebration-icon {
            font-size: 120px;
            margin-bottom: 30px;
            animation: iconBounce 1s ease-out, iconSpin 2s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes iconBounce {
            0% {
                transform: scale(0) rotate(0deg);
            }
            50% {
                transform: scale(1.3) rotate(180deg);
            }
            100% {
                transform: scale(1) rotate(360deg);
            }
        }

        @keyframes iconSpin {
            0%, 100% {
                transform: rotate(-5deg) scale(1);
            }
            50% {
                transform: rotate(5deg) scale(1.1);
            }
        }

        /* TEXT STYLES */
        .thank-you-title {
            font-size: 48px;
            font-weight: 800;
            color: white;
            margin-bottom: 20px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            animation: titleSlideIn 1.2s ease-out;
        }

        @keyframes titleSlideIn {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .thank-you-message {
            font-size: 22px;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 30px;
            line-height: 1.8;
            animation: messageSlideIn 1.4s ease-out;
        }

        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .close-instruction {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 40px;
            font-style: italic;
            animation: fadeInSlow 2s ease-out;
        }

        @keyframes fadeInSlow {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* BUTTONS */
        .button-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            animation: buttonSlideUp 1.6s ease-out;
        }

        @keyframes buttonSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .action-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .action-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .action-button:active {
            transform: translateY(-1px) scale(1.02);
        }

        .secondary-button {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .secondary-button:hover {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.3);
        }

        /* SPARKLE EFFECTS */
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px white;
            animation: sparkleAnimation 2s ease-in-out infinite;
        }

        @keyframes sparkleAnimation {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* HEART PULSE */
        .heart-pulse {
            position: absolute;
            font-size: 30px;
            animation: heartPulse 1.5s ease-in-out infinite;
        }

        @keyframes heartPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 768px) {
            .content-container {
                padding: 40px 30px;
            }

            .celebration-icon {
                font-size: 80px;
            }

            .thank-you-title {
                font-size: 32px;
            }

            .thank-you-message {
                font-size: 18px;
            }

            .close-instruction {
                font-size: 16px;
            }

            .action-button {
                padding: 15px 35px;
                font-size: 16px;
            }

            .button-container {
                flex-direction: column;
                align-items: center;
            }

            .action-button {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
<!-- Main Content -->
<div class="content-container">
    <div class="celebration-icon">🎊</div>
    <h1 class="thank-you-title">Thanks for Listening!</h1>
    <p class="thank-you-message">
        Your journey with us has been amazing. The message has been delivered with love and music.
    </p>
    <p class="close-instruction">
        You can now close this tab or explore more 🌟
    </p>

    <div class="button-container">
        <a th:href="@{/app/music/public/login}" class="action-button">
            Login to Your Account
        </a>
        <button onclick="window.close()" class="action-button secondary-button">
            Close Tab
        </button>
    </div>
</div>

<script>
    // Generate confetti
    function createConfetti() {
        const colors = ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#00f2fe', '#fff', '#ffd700', '#ff69b4'];
        const confettiCount = 100;

        for (let i = 0; i < confettiCount; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
            confetti.style.animationDelay = Math.random() * 5 + 's';
            confetti.style.width = (Math.random() * 10 + 5) + 'px';
            confetti.style.height = (Math.random() * 10 + 5) + 'px';

            // Random shapes
            if (Math.random() > 0.5) {
                confetti.style.borderRadius = '50%';
            }

            document.body.appendChild(confetti);
        }
    }

    // Generate floating emojis
    function createFloatingEmojis() {
        const emojis = ['🎉', '🎊', '✨', '⭐', '💫', '🌟', '🎵', '🎶', '💖', '🎈', '🎁'];
        const emojiCount = 30;

        for (let i = 0; i < emojiCount; i++) {
            const emoji = document.createElement('div');
            emoji.className = 'emoji';
            emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.left = Math.random() * 100 + '%';
            emoji.style.animationDuration = (Math.random() * 5 + 5) + 's';
            emoji.style.animationDelay = Math.random() * 5 + 's';
            emoji.style.fontSize = (Math.random() * 30 + 20) + 'px';

            document.body.appendChild(emoji);
        }
    }

    // Generate sparkles
    function createSparkles() {
        const sparkleCount = 50;
        const container = document.querySelector('.content-container');

        for (let i = 0; i < sparkleCount; i++) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = Math.random() * 100 + '%';
            sparkle.style.top = Math.random() * 100 + '%';
            sparkle.style.animationDelay = Math.random() * 2 + 's';
            sparkle.style.animationDuration = (Math.random() * 2 + 1) + 's';

            container.appendChild(sparkle);
        }
    }

    // Generate heart pulses
    function createHeartPulses() {
        const heartCount = 8;
        const container = document.querySelector('.content-container');

        for (let i = 0; i < heartCount; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart-pulse';
            heart.textContent = '❤️';
            heart.style.left = (Math.random() * 80 + 10) + '%';
            heart.style.top = (Math.random() * 80 + 10) + '%';
            heart.style.animationDelay = Math.random() * 1.5 + 's';

            container.appendChild(heart);
        }
    }

    // Initialize all animations
    window.addEventListener('DOMContentLoaded', () => {
        createConfetti();
        createFloatingEmojis();
        createSparkles();
        createHeartPulses();

        // Add continuous confetti every 3 seconds
        setInterval(() => {
            if (document.querySelectorAll('.confetti').length < 150) {
                createConfetti();
            }
        }, 3000);

        // Play celebration sound (optional - commented out)
        // const audio = new Audio('celebration-sound.mp3');
        // audio.play().catch(e => console.log('Audio autoplay prevented'));
    });

    // Add keyboard shortcut to close (Escape key)
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            window.close();
        }
    });
</script>
</body>
</html>
